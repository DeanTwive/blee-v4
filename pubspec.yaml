name: blee
description: "Blee — The Running Community That Moves You"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Firebase
  firebase_core: ^4.15.0
  firebase_auth: ^6.7.0
  firebase_crashlytics: ^5.4.0
  firebase_analytics: ^12.6.0

  # Supabase
  supabase_flutter: ^2.9.1

  # State Management
  flutter_riverpod: ^3.3.1
  riverpod_annotation: ^4.0.2

  # Routing
  go_router: ^17.5.0

  # Location & Background GPS
  geolocator: ^14.1.1
  geolocator_android: ^5.1.1
  flutter_background_service: ^5.1.0
  permission_handler: ^13.0.2
  pedometer: ^4.0.1

  # Local Database
  sqflite: ^2.4.2
  path_provider: ^2.1.5

  # Maps
  google_maps_flutter: ^2.10.0

  # Image & Media
  image_picker: ^1.1.2
  share_plus: ^13.3.1
  screenshot: ^3.0.0

  # Network image
  cached_network_image: ^3.4.1

  # Utilities
  intl: ^0.20.2
  uuid: ^4.5.1
  crypto: ^3.0.6
  connectivity_plus: ^7.3.1
  path: ^1.9.1

  # UI Enhancements
  shimmer: ^3.0.0
  flutter_map: ^8.3.2
  latlong2: ^0.10.1
  cloud_firestore: ^6.10.0
  shared_preferences: ^2.5.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.15
  riverpod_generator: ^4.0.3
  json_serializable: ^6.9.5

flutter:
  uses-material-design: true

dependency_overrides:
  permission_handler_android: 13.0.1
